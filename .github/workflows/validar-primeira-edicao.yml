name: Validar prévia da primeira edição
on:
  pull_request:
    paths:
      - 'data/editorial/primeira-edicao.ts'
      - 'components/CriarRascunhoPrimeiraEdicao.tsx'
      - 'app/admin/artigos/previa-primeira-edicao/page.tsx'
      - 'app/admin/artigos/page.tsx'
      - 'tests/primeira-edicao-previa.test.cjs'
      - '.github/workflows/validar-primeira-edicao.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/primeira-edicao-previa.test.cjs
      - run: npx tsc --noEmit
