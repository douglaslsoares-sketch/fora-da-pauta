name: Validar home antes da divulgação
on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/page.module.css'
      - 'components/HomeTelegramButton.tsx'
      - 'data/campanhas.ts'
      - 'components/CabecalhoFichaPublica.tsx'
      - 'lib/eleicoes/formatar-cargo.ts'
      - 'data/eleicoes/tipos.ts'
      - 'scripts/importar-candidaturas-2026.ps1'
      - 'scripts/atualizar-tse-2026.ps1'
      - '.github/workflows/validar-home-divulgacao.yml'
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx eslint app/page.tsx components/CabecalhoFichaPublica.tsx lib/eleicoes/formatar-cargo.ts
      - name: Testes isolados do Telegram
        run: node --test tests/telegram-webhook.test.cjs tests/telegram-sessao.test.cjs tests/telegram-concluir.test.cjs
      - name: Conferir caminhos e integridade editorial da home
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const home = fs.readFileSync('app/page.tsx','utf8');
          const telegram = fs.readFileSync('components/HomeTelegramButton.tsx','utf8');
          assert.ok(home.includes('Conhecer é importante. Entender como o jogo é jogado é fundamental.'));
          assert.ok(home.includes('href="/votou-fique-de-olho"'));
          assert.ok(home.includes('href="/conheca-seu-candidato"'));
          assert.ok(home.includes('Votou? Fique de olho.'));
          assert.ok(home.includes('Conheça seu candidato'));
          assert.ok(home.includes('Edições já publicadas'));
          assert.ok(home.includes('publicacoes.length > 0'));
          assert.ok(home.includes('campaign.publishedAt'));
          assert.ok(home.includes('campaign.slug !== "fim-escala-6x1"'));
          assert.ok(home.includes('campaign.slug !== "seus-interesses"'));
          assert.ok(home.includes('Do povo para o povo.'));
          assert.ok(telegram.includes('href="/votou-fique-de-olho"'));
          console.log('Home: navegação, conteúdo editorial e ocultação aprovados.');
          NODE
