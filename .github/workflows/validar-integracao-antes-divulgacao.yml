name: Validar integração sem publicar

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "data/eleicoes/dossies/**"
      - "tests/**"
      - ".github/workflows/validar-integracao-antes-divulgacao.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Testar monitor, contexto, fila simulada e navegação
        run: |
          node --test tests/monitor-mencoes-institucionais.test.mjs
          node --test tests/resenhas-contextuais.test.cjs
          node --test tests/telegram-avisos-dossie.test.cjs
          node --test tests/telegram-avisos-atuacao-fonte.test.cjs
          node --test tests/telegram-fila-editorial-integracao.test.cjs
          node --test tests/home-fique-de-olho-telegram.test.cjs
          node --test tests/download-proposicoes.test.cjs
      - name: Validar TypeScript
        run: npx tsc --noEmit
      - name: Compilar site inteiro sem publicar
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Apenas permite importar rotas que instanciam postgres.
          # Endereço deliberadamente inacessível; nenhuma consulta é permitida neste teste.
          DATABASE_URL: "postgres://fdp_ci:nao-usar@127.0.0.1:1/fdp_build"
        run: npm run build
      - name: Validar sintaxe do coletor parlamentar
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/gerar-atuacao-proposicoes-politicas.ps1),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-Table
            throw 'Falha de sintaxe PowerShell'
          }
