name: Auditar integridade dos vínculos da Câmara
on:
  push:
    branches: [quero-entender-melhor]
    paths:
      - scripts/auditar-integridade-vinculos-camara.mjs
      - .github/workflows/auditar-integridade-vinculos-camara.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar integridade sem alterar os dados
        run: node scripts/auditar-integridade-vinculos-camara.mjs
