name: Validar receptor Resend isolado
on:
  pull_request:
    paths:
      - 'app/api/integracoes/resend-teste/route.ts'
      - 'tests/interacoes-resend-isolado.test.cjs'
      - 'tests/prontidao-recados-sem-envio.test.cjs'
      - 'app/api/admin/contatos-politicos/prontidao/route.ts'
      - 'app/api/candidatos/buscar/route.ts'
      - 'components/VerificarContatosPoliticos.tsx'
      - 'app/api/admin/contatos-politicos/mandatos-em-exercicio/route.ts'
      - 'tests/mandatos-atuais-sem-envio.test.cjs'
      - 'tests/contato-governador-posse.test.cjs'
      - 'lib/eleicoes/contato-governador.ts'
      - 'lib/eleicoes/consultar-contato-parlamentar.ts'
      - '.github/workflows/testar-resend-isolado.yml'
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/interacoes-resend-isolado.test.cjs tests/prontidao-recados-sem-envio.test.cjs tests/mandatos-atuais-sem-envio.test.cjs tests/contato-governador-posse.test.cjs
      - run: npx tsc --noEmit
