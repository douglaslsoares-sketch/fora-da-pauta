name: Backup diario criptografado do Neon

on:
  schedule:
    # 06:27 UTC = 03:27 no horario de Brasilia (UTC-3).
    - cron: '27 6 * * *'
    workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-neon-diario
  cancel-in-progress: false

jobs:
  backup:
    name: Exportar e criptografar banco
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGHOST: ${{ secrets.NEON_BACKUP_HOST }}
      PGUSER: ${{ secrets.NEON_BACKUP_USER }}
      PGPASSWORD: ${{ secrets.NEON_BACKUP_PASSWORD }}
      PGDATABASE: neondb
      PGPORT: '5432'
      PGSSLMODE: require
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.NEON_BACKUP_ENCRYPTION_PASSWORD }}
    steps:
      - name: Verificar configuracao dos segredos
        shell: bash
        run: |
          set -euo pipefail
          for variable in PGHOST PGUSER PGPASSWORD BACKUP_ENCRYPTION_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Segredo obrigatorio ausente: $variable"
              exit 1
            fi
          done

      - name: Instalar 7-Zip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          command -v 7z

      - name: Exportar Neon, criptografar e validar arquivo
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          base="fora-da-pauta-neondb-${timestamp}"
          original="${RUNNER_TEMP}/${base}.backup"
          encrypted="${RUNNER_TEMP}/${base}.7z"
          cleanup() { rm -f -- "$original"; }
          trap cleanup EXIT

          # Cliente PG18 funciona com servidores PostgreSQL de versao igual ou anterior.
          # A senha do banco e transmitida apenas como variavel de ambiente.
          docker run --rm \
            --env PGHOST --env PGUSER --env PGPASSWORD \
            --env PGDATABASE --env PGPORT --env PGSSLMODE \
            postgres:18 \
            pg_dump --no-password --format=custom --no-owner --no-acl > "$original"

          test -s "$original"

          # AES-256 no formato 7z; -mhe=on tambem oculta nomes de arquivos.
          7z a -t7z -mhe=on -mx=5 \
            "-p${BACKUP_ENCRYPTION_PASSWORD}" "$encrypted" "$original" > /dev/null

          test -s "$encrypted"
          7z t "-p${BACKUP_ENCRYPTION_PASSWORD}" "$encrypted" > /dev/null
          printf 'ARCHIVE_FILE=%s\n' "$encrypted" >> "$GITHUB_ENV"
          printf 'ARCHIVE_NAME=%s\n' "${base}" >> "$GITHUB_ENV"
          echo "Backup criptografado criado e validado."

      - name: Guardar backup criptografado por 30 dias no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_FILE }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Enviar backup criptografado ao Google Drive
        shell: bash
        env:
          BACKUP_WEB_APP_URL: ${{ secrets.BACKUP_WEB_APP_URL }}
          BACKUP_UPLOAD_TOKEN: ${{ secrets.BACKUP_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import json
          import base64
          import hashlib
          import sys
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = os.environ["BACKUP_WEB_APP_URL"]
          token = os.environ["BACKUP_UPLOAD_TOKEN"]
          caminho = Path(os.environ["ARCHIVE_FILE"])

          if not url.startswith("https://script.google.com/macros/s/"):
              sys.exit("URL do Google Apps Script invalida")

          if not token:
              sys.exit("Chave de autorizacao ausente")

          conteudo = caminho.read_bytes()
          resumo = hashlib.sha256(conteudo).hexdigest()

          dados = {
              "token": token,
              "name": caminho.name,
              "contentBase64": base64.b64encode(conteudo).decode("ascii"),
              "sha256": resumo
          }

          requisicao = Request(
              url,
              data=json.dumps(dados).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urlopen(requisicao, timeout=120) as resposta:
                  resultado = json.loads(resposta.read())
          except Exception:
              sys.exit("Falha ao enviar arquivo ao Google Drive")

          if resultado.get("ok") is not True:
              erro = resultado.get("erro", "resposta_invalida")
              sys.exit("Envio nao confirmado: " + str(erro))

          if (not resultado.get("jaExiste")
                  and resultado.get("sha256") != resumo):
              sys.exit("Falha na verificacao de integridade")

          print("Backup confirmado no Google Drive")
          PY
