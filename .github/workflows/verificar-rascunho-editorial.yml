name: Verificar rascunho editorial
on:
  pull_request:
    paths:
      - 'data/edicoes/rascunhos/lula-venceu-o-globo.ts'
      - 'components/CampaignPage.tsx'
      - 'components/ExpandableCard.tsx'
      - 'components/PreviewAudioReader.tsx'
      - 'tests/edicao-jogo-rascunho.test.cjs'
      - 'scripts/audio/preparar-roteiro-edicao.cjs'
      - 'tests/audio-roteiro-edicao.test.cjs'
      - '.github/workflows/verificar-rascunho-editorial.yml'
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: node --test tests/edicao-jogo-rascunho.test.cjs
      - run: node --test tests/audio-roteiro-edicao.test.cjs
      - run: node scripts/audio/preparar-roteiro-edicao.cjs --check
